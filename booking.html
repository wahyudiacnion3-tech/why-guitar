<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY GUITAR - Booking Servis</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#090a0c;
 color:#fff;
 font-family:Arial,sans-serif
}
.wrap{
 max-width:560px;
 margin:auto;
 padding:25px 18px 40px
}
.logo{text-align:center}
.logo img{width:140px;max-height:140px}
h1{text-align:center;font-size:32px;margin:15px 0 5px}
.sub{text-align:center;color:#aaa;font-size:18px;margin-bottom:25px}
.card{
 background:#17181d;
 border:1px solid #33353e;
 border-radius:22px;
 padding:22px
}
label{
 display:block;
 margin:17px 0 8px;
 font-weight:bold;
 color:#ddd
}
input,select,textarea{
 width:100%;
 padding:15px;
 border-radius:14px;
 border:1px solid #33353e;
 background:#0f1014;
 color:#fff;
 font-size:16px;
 outline:none
}
textarea{min-height:110px;resize:vertical}
button{
 width:100%;
 margin-top:24px;
 padding:16px;
 border:0;
 border-radius:14px;
 background:#ed2027;
 color:#fff;
 font-size:18px;
 font-weight:bold
}
.info{
 margin-top:18px;
 padding:15px;
 border-radius:14px;
 background:#22242b;
 color:#bbb;
 line-height:1.5;
 font-size:14px
}
.back{
 display:block;
 text-align:center;
 margin-top:22px;
 color:#fff;
 text-decoration:none
}
</style>
</head>

<body>

<div class="wrap">

<div class="logo">
<img src="icon-192.svg" alt="WHY GUITAR">
</div>

<h1>WHY GUITAR</h1>
<div class="sub">Booking Servis Gitar</div>

<div class="card">

<label>Nama Pelanggan</label>
<input id="nama" type="text" placeholder="Masukkan nama">

<label>WhatsApp</label>
<input id="wa" type="tel" placeholder="08xxxxxxxxxx">

<label>Jenis Gitar</label>
<input id="gitar" type="text" placeholder="Contoh: Fender Stratocaster">

<label>Jenis Servis</label>
<select id="servis">
<option value="">Pilih jenis servis</option>
<option>Set Up / Setting</option>
<option>Ganti Senar</option>
<option>Perbaikan Elektronik</option>
<option>Perbaikan Neck</option>
<option>Fret Service</option>
<option>Cleaning / Maintenance</option>
<option>Custom / Modifikasi</option>
<option>Servis Lainnya</option>
</select>

<label>Keluhan / Pekerjaan</label>
<textarea id="keluhan" placeholder="Jelaskan keluhan atau pekerjaan"></textarea>

<label>Rencana Datang</label>
<input id="tanggal" type="date">

<button onclick="booking()">🎸 BOOKING SERVIS</button>

<div class="info">
Setelah booking dikirim, WHY GUITAR akan menghubungi Anda melalui WhatsApp untuk konfirmasi.
</div>

</div>

<a class="back" href="index.html">← Kembali ke Halaman Utama</a>

</div>

<script>
function booking(){

const nama=document.getElementById("nama").value.trim();
const wa=document.getElementById("wa").value.trim();
const gitar=document.getElementById("gitar").value.trim();
const servis=document.getElementById("servis").value;
const keluhan=document.getElementById("keluhan").value.trim();
const tanggal=document.getElementById("tanggal").value;

if(!nama||!wa||!gitar||!servis||!keluhan){
alert("Mohon lengkapi semua data booking.");
return;
}

const pesan=
"🎸 BOOKING SERVIS WHY GUITAR\n\n"+
"Nama: "+nama+"\n"+
"WhatsApp: "+wa+"\n"+
"Gitar: "+gitar+"\n"+
"Jenis Servis: "+servis+"\n"+
"Keluhan/Pekerjaan: "+keluhan+"\n"+
"Rencana Datang: "+(tanggal||"-")+"\n\n"+
"Mohon konfirmasi booking servis saya.\nTerima kasih.";

const nomor="681258240494";

window.location.href=
"https://wa.me/"+nomor+"?text="+encodeURIComponent(pesan);
}
</script>

</body>
</html>
