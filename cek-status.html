<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Status Gitar - WHY GUITAR</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

.container{
  max-width:650px;
  margin:auto;
  padding:25px 16px 50px;
}

.header{
  text-align:center;
  padding:25px 10px;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.tag{
  margin-top:8px;
  font-size:13px;
  color:#777;
}

h1{
  margin:10px 0 5px;
  font-size:28px;
}

.sub{
  color:#777;
  font-size:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-top:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.result{
  margin-top:18px;
}

.resultbox{
  background:#fafafa;
  border-radius:15px;
  padding:18px;
}

.resultbox h2{
  margin-top:0;
}

.info{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.info:last-child{
  border-bottom:0;
}

.status{
  display:inline-block;
  padding:8px 12px;
  border-radius:20px;
  background:#eee;
  font-weight:bold;
}

.photos{
  margin-top:20px;
}

.photos h3{
  margin-bottom:15px;
}

.photo-box{
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.photo-box b{
  display:block;
  margin-bottom:10px;
}

.photo-box img{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:10px;
  display:block;
}

.error{
  background:#fff0f0;
  color:#b00020;
  padding:14px;
  border-radius:12px;
}

.footer{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">WHY GUITAR</div>
    <div class="tag">More Than Just a Service</div>

    <h1>🎸 Cek Status Gitar</h1>
