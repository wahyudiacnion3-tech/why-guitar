<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHY GUITAR - Cek Status</title>
<style>
body{margin:0;background:#0d0f13;color:white;font-family:Arial;text-align:center}
.box{max-width:650px;margin:auto;padding:40px 20px}
h1{font-size:38px;margin:20px 0}
p{color:#9da5b4;font-size:18px}
.card{background:#171a21;border:1px solid #30343d;border-radius:20px;padding:20px;margin-top:25px}
input{width:100%;padding:18px;border-radius:14px;border:2px solid #d9a536;background:#101217;color:white;font-size:20px;box-sizing:border-box}
button{width:100%;padding:18px;margin-top:15px;border:0;border-radius:14px;background:#d9a536;font-size:19px;font-weight:bold}
.result{margin-top:20px;padding:20px;background:#171a21;border-radius:20px;text-align:left}
.err{color:#ff7777}
</style>
</head>

<body>
<div class="box">

<b style="font-size:25px;letter-spacing:2px">WHY GUITAR</b>
<p>Guitar Service</p>

<h1>Cek Status Gitar</h1>
<p>Masukkan nomor service yang Anda terima.</p>

<div class="card">
<input id="no" placeholder="Contoh: GTR-09-01">
<button onclick="cek()">🔎 Cek Status</button>
</div>

<div id="hasil"></div>

</div>

<script>
const URL="https://irfjnhzrfeqqobhbntzu.supabase.co";
const KEY="sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1";

async function cek(){
 const no=document.getElementById("no").value.trim();
 const hasil=document.getElementById("hasil");

 if(!no){
  hasil.innerHTML='<div class="result err">Masukkan nomor service.</div>';
  return;
 }

 hasil.innerHTML='<div class="result">⏳ Memeriksa data...</div>';

 try{
  const r=await fetch(
   URL+"/rest/v1/services?service_no=eq."+encodeURIComponent(no)+"&select=*",
   {
    headers:{
     apikey:KEY,
     Authorization:"Bearer "+KEY
    }
   }
  );

  if(!r.ok) throw new Error("HTTP "+r.status);

  const data=await r.json();

  if(!data.length){
   hasil.innerHTML='<div class="result err"><b>Nomor service tidak ditemukan.</b><br><br>Periksa kembali nomor service.</div>';
   return;
  }

   const s = data[0];

const status = String(s.status || "Diterima").trim();

const statusList = [
  "Diterima",
  "Sedang diperiksa",
  "Dikerjakan",
  "Selesai",
  "Diambil"
];

let statusIndex = statusList.findIndex(
  x => x.toLowerCase() === status.toLowerCase()
);

if (statusIndex < 0) statusIndex = 0;

const progress = ((statusIndex + 1) / statusList.length) * 100;

const guitar =
  s.guitar_name ||
  s.guitar ||
  s.model ||
  s.guitar_model ||
  "-";

const biaya = Number(s.total_cost || 0).toLocaleString("id-ID");

hasil.innerHTML = `
<div class="result">

  <h2>🎸 ${s.service_no || "-"}</h2>

  <p><b>👤 Pelanggan:</b><br>
  ${s.customer_name || "-"}</p>

  <p><b>🎸 Gitar:</b><br>
  ${guitar}</p>

  <p><b>📌 Status Servis:</b><br>
  <strong>${status}</strong></p>

  <div style="
    background:#333;
    border-radius:20px;
    height:18px;
    margin:12px 0;
    overflow:hidden;
  ">
    <div style="
      width:${progress}%;
      height:100%;
      background:#e0a928;
      border-radius:20px;
      transition:width .5s;
    "></div>
  </div>

  <div style="
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#aaa;
    margin-bottom:20px;
  ">
    <span>Diterima</span>
    <span>Diperiksa</span>
    <span>Dikerjakan</span>
    <span>Selesai</span>
    <span>Diambil</span>
  </div>

  <p><b>💰 Biaya:</b><br>
  Rp ${biaya}</p>

  <a
    href="https://wa.me/6281258240494"
    target="_blank"
    style="
      display:block;
      text-align:center;
      text-decoration:none;
      background:#25D366;
      color:white;
      padding:15px;
      border-radius:12px;
      font-weight:bold;
      margin-top:20px;
    "
  >
    💬 Hubungi Why Guitar via WhatsApp
  </a>

</div>
`;}catch(e){
  hasil.innerHTML='<div class="result err"><b>Gagal membaca database.</b><br><br>'+e.message+'</div>';
 }
}
</script>
</body>
</html>
