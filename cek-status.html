<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Guitar - Cek Status</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

.container{
  max-width:520px;
  margin:auto;
  padding:25px 18px;
}

.card{
  background:#1d1d1d;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
}

h1{
  text-align:center;
  margin:5px 0 8px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #555;
  background:#fff;
  color:#111;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

.result{
  margin-top:20px;
}

.item{
  background:#252525;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.no{
  font-size:18px;
  font-weight:bold;
}

.muted{
  color:#aaa;
  margin-top:5px;
}

.pill{
  background:#fff;
  color:#111;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.detail{
  margin-top:14px;
  line-height:1.8;
  border-top:1px solid #444;
  padding-top:12px;
}

.progress{
  height:10px;
  background:#444;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.bar{
  height:100%;
  background:#fff;
}

.err{
  text-align:center;
  color:#ff7777;
  padding:15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>WHY GUITAR</h1>

    <div class="sub">
      Cek Status Servis Gitar
    </div>

    <input
      id="serviceNo"
      placeholder="Contoh: GTR-09-01"
      autocomplete="off"
    >

    <button onclick="checkStatus()">
      Cek Status →
    </button>

    <div id="statusResult" class="result"></div>

  </div>

</div>

<script>

const SUPA = {
  url: "https://irfjnhzrfeqqobhntzu.supabase.co",
  key: "sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1"
};


async function getData(no){

  const url =
    SUPA.url +
    "/rest/v1/services" +
    "?service_no=eq." +
    encodeURIComponent(no) +
    "&select=*";

  const response = await fetch(url,{
    method:"GET",
    headers:{
      "apikey":SUPA.key
    }
  });

  if(!response.ok){
    const errorText = await response.text();
    console.log("SUPABASE ERROR:",errorText);
    throw new Error("Database error");
  }

  return await response.json();
}


function formatMoney(value){

  if(value === null || value === undefined || value === ""){
    return "Belum ditentukan";
  }

  let text = String(value).trim();

  if(/^rp/i.test(text)){
    text = text.replace(/^rp\.?\s*/i,"");
  }

  const angka = text.replace(/[^\d]/g,"");

  if(angka){
    return "Rp " + Number(angka).toLocaleString("id-ID");
  }

  return value;
}


function progress(status){

  const s = String(status || "").toLowerCase();

  if(s.includes("selesai")) return 100;
  if(s.includes("siap")) return 90;
  if(s.includes("dikerjakan")) return 70;
  if(s.includes("diperiksa")) return 40;
  if(s.includes("masuk")) return 20;

  return 10;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


async function checkStatus(){

  const no =
    document.getElementById("serviceNo").value.trim();

  const out =
    document.getElementById("statusResult");

  if(!no){

    out.innerHTML =
      '<div class="err">Masukkan nomor service dulu.</div>';

    return;
  }

  out.innerHTML = "Memuat data...";

  try{

    const data = await getData(no);

    console.log("DATA:",data);

    if(!data || data.length === 0){

      out.innerHTML =
        '<div class="err">Nomor service tidak ditemukan.</div>';

      return;
    }

    const x = data[0];

    const status = x.status || "-";
    const persen = progress(status);

    /*
      Kolom database:
      service_no
      customer_name
      guitar
      status
      technician
      estimate
    */

    out.innerHTML = `

      <div class="item">

        <div class="row">

          <div>
            <div class="no">
              ${escapeHTML(x.service_no || "-")}
            </div>

            <div class="muted">
              ${escapeHTML(x.customer_name || "")}
              ·
              ${escapeHTML(x.guitar || "")}
            </div>
          </div>

          <span class="pill">
            ${escapeHTML(status)}
          </span>

        </div>


        <div class="detail">

          Pelanggan:
          <b>${escapeHTML(x.customer_name || "-")}</b>

          <br>

          Gitar:
          <b>${escapeHTML(x.guitar || "-")}</b>

          <br>

          Teknisi:
          <b>${escapeHTML(x.technician || "-")}</b>

          <br>

          Estimasi Biaya:
          <b>${formatMoney(x.estimate)}</b>

        </div>


        <div class="detail">

          Progress Servis

          <div class="progress">

            <div
              class="bar"
              style="width:${persen}%"
            ></div>

          </div>

        </div>

      </div>

    `;

  }catch(error){

    console.error(error);

    out.innerHTML =
      '<div class="err">Terjadi kesalahan saat mengambil data.</div>';

  }

}


document
  .getElementById("serviceNo")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      checkStatus();
    }

  });

</script>

</body>
</html>
