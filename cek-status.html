<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WHY GUITAR - Cek Status</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d0f13;
  color:#f5f7fb;
  font-family:Arial, sans-serif;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  padding:28px 20px 55px;
}

.brand{
  text-align:center;
  margin-bottom:34px;
}

.brandmark{
  display:inline-block;
  font-weight:800;
  letter-spacing:1px;
  font-size:18px;
}

.brandmark small{
  display:block;
  color:#9da5b4;
  font-size:12px;
  margin-top:3px;
}

h1{
  text-align:center;
  font-size:42px;
  margin:0 0 12px;
}

.subtitle{
  text-align:center;
  color:#9da5b4;
  font-size:17px;
  margin-bottom:25px;
}

.card{
  background:#171a21;
  border:1px solid #2b303b;
  border-radius:18px;
  padding:20px;
  margin-top:18px;
}

input{
  width:100%;
  padding:16px;
  background:#11141a;
  color:#fff;
  border:1px solid #414754;
  border-radius:14px;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#e9a536;
}

button{
  width:100%;
  padding:16px;
  margin-top:14px;
  border:0;
  border-radius:14px;
  background:#e9a536;
  color:#111;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.result{
  margin-top:18px;
}

.muted{
  color:#9da5b4;
}

.error{
  background:#24171a;
  border:1px solid #6b3038;
  color:#ffb4bb;
  padding:18px;
  border-radius:14px;
}

.resultbox{
  background:#171a21;
  border:1px solid #2b303b;
  border-radius:18px;
  padding:20px;
}

.head{
  margin-bottom:18px;
}

.head h2{
  margin:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.item{
  background:#11141a;
  border:1px solid #2b303b;
  border-radius:12px;
  padding:13px;
}

.label{
  display:block;
  color:#9da5b4;
  font-size:12px;
  margin-bottom:5px;
}

.steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin:20px 0;
}

.step{
  text-align:center;
  padding:9px 4px;
  border-radius:10px;
  background:#222631;
  color:#8f96a3;
  font-size:11px;
}

.step.active{
  background:#e9a536;
  color:#111;
  font-weight:800;
}

.wa{
  display:block;
  text-align:center;
  margin:18px auto;
  padding:16px;
  max-width:460px;
  border-radius:14px;
  background:#e9a536;
  color:#111;
  font-weight:800;
  text-decoration:none;
}

@media(max-width:600px){
  h1{
    font-size:36px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .steps{
    grid-template-columns:1fr;
  }
}
</style>
</head>

      WHY GUITAR
      <small>Guitar Service</small>
    </div>
  </div>

    Masukkan nomor service yang Anda terima.
  </div>
