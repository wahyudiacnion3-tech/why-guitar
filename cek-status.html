<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY GUITAR - Cek Status</title>
</head>

<body>

<h1>🎸 WHY GUITAR</h1>

<h2>Cek Status Gitar</h2>

<p>Masukkan nomor service:</p>

<input id="serviceNo" placeholder="Contoh: GTR/SQ/09/01">

<button onclick="cekStatus()">CEK STATUS</button>

<div id="hasil"></div>

<script>

const SUPABASE_URL =
"https://irfjnhzrfeqqobhbntzu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XbSV_b9aa10bIWE8YqAU8YqauBw_KPypPIe1";

async function cekStatus(){

    const no = document
        .getElementById("serviceNo")
        .value
        .trim();

    const hasil = document
        .getElementById("hasil");

    if(!no){
        hasil.innerHTML =
        "<p>Masukkan nomor service dulu.</p>";
        return;
    }

    hasil.innerHTML =
    "<p>⏳ Mencari data...</p>";

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/services?service_no=eq." +
            encodeURIComponent(no) +
            "&select=*",
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        if(!data.length){

            hasil.innerHTML =
            "<p>❌ Nomor service tidak ditemukan.</p>";

            return;
        }

        const s = data[0];

        hasil.innerHTML = `
            <hr>
            <h2>🎸 Data Service</h2>

            <p>
            <b>No. Service:</b><br>
            ${s.service_no || "-"}
            </p>

            <p>
            <b>Customer:</b><br>
            ${s.customer_name || "-"}
            </p>

            <p>
            <b>Gitar:</b><br>
            ${s.guitar || "-"}
            </p>

            <p>
            <b>Status:</b><br>
            ${s.status || "-"}
            </p>

            <p>
            <b>Keluhan:</b><br>
            ${s.complaint || "-"}
            </p>

            <p>
            <b>Biaya:</b><br>
            Rp ${Number(s.cost || 0).toLocaleString("id-ID")}
            </p>
        `;

    }catch(error){

        console.log(error);

        hasil.innerHTML =
        "<p>❌ Gagal terhubung ke server.</p>";

    }

}

</script>

</body>
</html>
