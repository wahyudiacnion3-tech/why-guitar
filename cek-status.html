<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Guitar - Tes Database</title>
<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}
.box{
  max-width:500px;
  margin:30px auto;
  background:#1e1e1e;
  padding:25px;
  border-radius:15px;
}
h1{text-align:center}
input{
  width:100%;
  padding:14px;
  font-size:16px;
  box-sizing:border-box;
  border-radius:8px;
  border:0;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}
#hasil{
  margin-top:20px;
  padding:15px;
  background:#292929;
  border-radius:8px;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="box">

<h1>WHY GUITAR</h1>

<p style="text-align:center">
Tes koneksi database
</p>

<input
  id="nomor"
  value="GTR-09-01"
  placeholder="No. Servis"
>

<button onclick="tes()">
TES DATABASE
</button>

<div id="hasil">
Belum dites.
</div>

</div>

<script>

const URL_SUPABASE =
"https://irfjnhzrfeqqobhntzu.supabase.co";

const KEY_SUPABASE =
"sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1";

async function tes(){

  const hasil =
  document.getElementById("hasil");

  const nomor =
  document.getElementById("nomor").value.trim();

  hasil.innerHTML = "Sedang menghubungi Supabase...";

  try{

    const url =
      URL_SUPABASE +
      "/rest/v1/services" +
      "?service_no=eq." +
      encodeURIComponent(nomor) +
      "&select=*";

    const response = await fetch(url,{
      method:"GET",
      headers:{
        "apikey":KEY_SUPABASE,
        "Authorization":"Bearer " + KEY_SUPABASE
      }
    });

    const text = await response.text();

    hasil.innerHTML =
      "<b>HTTP: " + response.status + "</b><br><br>" +
      "<b>HASIL:</b><br>" +
      text;

  }catch(error){

    hasil.innerHTML =
      "<b>ERROR:</b><br>" +
      error.message;

  }

}

</script>

</body>
</html>
