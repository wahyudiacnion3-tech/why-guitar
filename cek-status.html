<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHY GUITAR — Cek Status</title>

<style>
:root{
  --bg:#0d0f13;
  --card:#171a21;
  --muted:#9da5b4;
  --text:#f5f7fb;
  --accent:#e9a536;
  --line:#2b303b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#171a21 0,#0d0f13 45%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  padding:28px 20px 55px;
}

.brand{
  text-align:center;
  margin-bottom:34px;
}

.brandmark{
  display:inline-block;
  font-weight:800;
  letter-spacing:.5px;
  font-size:18px;
}

.brandmark small{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  margin-top:3px;
}

h1{
  text-align:center;
  font-size:42px;
  margin:0 0 12px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:17px;
  margin-bottom:25px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-top:18px;
}

input{
  width:100%;
  padding:16px;
  background:#11141a;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:14px;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:var(--accent);
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  background:var(--accent);
  color:#111;
  border:0;
  border-radius:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

.result{
  margin-top:18px;
}

.resultbox{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.head{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.head h2{
  margin:0;
  font-size:25px;
}

.muted{
  color:var(--muted);
}

.steps{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
  margin:20px 0;
}

.step{
  text-align:center;
}

.dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid var(--line);
  margin:auto;
}

.step.active .dot{
  background:var(--accent);
  border-color:var(--accent);
}

.step span{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
}

.step.active span{
  color:var(--text);
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.item{
  background:#11141a;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
}

.label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.error{
  background:#25191a;
  border:1px solid #6b3434;
  border-radius:18px;
  padding:20px;
}

.whatsapp{
  display:block;
  text-align:center;
  margin:20px auto 0;
  width:fit-content;
  max-width:100%;
  padding:14px 25px;
  background:var(--accent);
  color:#111;
  border-radius:15px;
  font-weight:800;
  text-decoration:none;
}

.history{
  margin-top:25px;
  text-align:center;
}

@media(max-width:600px){
  .wrap{
    padding:28px 20px 45px;
  }

  h1{
    font-size:38px;
  }

  .steps{
    grid-template-columns:repeat(3,1fr);
    row-gap:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="brandmark">
      WHY GUITAR
      <small>Guitar Service</small>
    </div>
  </div>

  <h1>Cek Status Gitar</h1>

  <div class="subtitle">
    Masukkan nomor service yang Anda terima.
  </div>

  <section class="card">

    <input
      id="serviceNo"
      placeholder="Contoh: GTR-09-01"
      autocomplete="off"
      autocapitalize="characters"
    >

    <button id="checkBtn" onclick="checkStatus()">
      Cek Status
    </button>

    <div id="result" class="result"></div>

  </section>

  <a
    class="whatsapp"
    href="https://wa.me/6281258240494"
    target="_blank"
  >
    💬 WhatsApp: 0812-5824-0494
  </a>

</div>

<script>

const SUPABASE_URL =
  'https://irfjnhzrfeqqobhntzu.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1';

const STATUSES = [
  'Diterima',
  'Sedang diperiksa',
  'Menunggu sparepart',
  'Quality control',
  'Selesai'
];

function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function rupiah(v){
  const n = Number(v || 0);

  if(!Number.isFinite(n) || n <= 0){
    return '-';
  }

  return 'Rp ' + n.toLocaleString('id-ID');
}

function cleanNumber(v){
  const n = Number(v || 0);
  return Number.isFinite(n) ? n : 0;
}

function headers(){
  return {
    'apikey':SUPABASE_KEY,
    'Authorization':'Bearer ' + SUPABASE_KEY,
    'Content-Type':'application/json',
    'Accept':'application/json'
  };
}

async function queryService(no){

  const clean = String(no || '').trim();

  if(!clean){
    return null;
  }

  const url =
    SUPABASE_URL +
    '/rest/v1/services' +
    '?service_no=eq.' +
    encodeURIComponent(clean) +
    '&select=*' +
    '&limit=1';

  const res = await fetch(url,{
    method:'GET',
    headers:headers()
  });

  if(!res.ok){
    const text = await res.text();
    throw new Error(
      'Supabase HTTP ' +
      res.status +
      ': ' +
      text
    );
  }

  const rows = await res.json();

  return rows[0] || null;
}

function renderService(s){

  const status =
    String(s.status || 'Diterima');

  let idx =
    STATUSES.findIndex(
      x =>
        x.toLowerCase() ===
        status.toLowerCase()
    );

  if(idx < 0){
    idx = 0;
  }

  const cost =
    cleanNumber(
      s.cost ?? s.total_cost
    );

  const paid =
    cleanNumber(s.paid);

  const remaining =
    Math.max(0,cost-paid);

  return `
    <div class="resultbox">

      <div class="head">

        <div>
          <h2>
            ${esc(s.service_no || '')}
          </h2>

          <div class="muted">
            ${esc(s.customer_name || '-')}
          </div>
        </div>

        <strong>
          ${esc(status)}
        </strong>

      </div>

      <div class="steps">

        ${STATUSES.map((x,i)=>`
          <div class="step ${i<=idx?'active':''}">
            <div class="dot"></div>
            <span>${esc(x)}</span>
          </div>
        `).join('')}

      </div>

      <div class="grid">

        <div class="item">
          <span class="label">Pelanggan</span>
          ${esc(s.customer_name || '-')}
        </div>

        <div class="item">
          <span class="label">Gitar</span>
          ${esc(s.guitar || '-')}
        </div>

        <div class="item">
          <span class="label">Status</span>
          ${esc(status)}
        </div>

        <div class="item">
          <span class="label">Biaya</span>
          ${rupiah(cost)}
        </div>

        <div class="item">
          <span class="label">Sudah dibayar</span>
          ${rupiah(paid)}
        </div>

        <div class="item">
          <span class="label">Sisa</span>
          ${rupiah(remaining)}
        </div>

      </div>

      <div
        class="item"
        style="margin-top:10px"
      >
        <span class="label">Keluhan</span>
        ${esc(s.complaint || '-')}
      </div>

    </div>
  `;
}

async function checkStatus(){

  const result =
    document.getElementById('result');

  const button =
    document.getElementById('checkBtn');

  const input =
    document.getElementById('serviceNo');

  const no =
    input.value.trim();

  if(!no){

    result.innerHTML = `
      <div class="error">
        <b>Nomor service belum diisi.</b>
        <div class="muted" style="margin-top:8px">
          Masukkan nomor service terlebih dahulu.
        </div>
      </div>
    `;

    return;
  }

  button.disabled = true;
  button.textContent = 'Memeriksa...';

  result.innerHTML = `
    <div class="card">
      <div class="muted">
        Memeriksa data online...
      </div>
    </div>
  `;

  try{

    const s =
      await queryService(no);

    if(!s){

      result.innerHTML = `
        <div class="error">
          <b>Nomor service tidak ditemukan.</b>

          <div
            class="muted"
            style="margin-top:8px"
          >
            Periksa kembali kode service Anda.
          </div>
        </div>
      `;

      return;
    }

    result.innerHTML =
      renderService(s);

  }catch(e){

    console.error(e);

    result.innerHTML = `
      <div class="error">
        <b>Gagal membaca data.</b>

        <div
          class="muted"
          style="margin-top:8px"
        >
          Silakan coba lagi beberapa saat.
        </div>
      </div>
    `;

  }finally{

    button.disabled = false;
    button.textContent = 'Cek Status';

  }
}

document
  .getElementById('serviceNo')
  .addEventListener('keydown',function(e){

    if(e.key === 'Enter'){
      checkStatus();
    }

  });

</script>

</body>
</html>
