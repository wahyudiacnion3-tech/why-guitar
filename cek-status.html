<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Servis - Why Guitar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #hasil {
      margin-top: 20px;
    }

    .info {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 4px;
    }

    .value {
      font-size: 16px;
      font-weight: bold;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #e9f7ef;
      margin: 15px 0;
      text-align: center;
      font-weight: bold;
    }

    .progress {
      height: 12px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 10px 0 20px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #111;
      transition: width 0.5s;
    }

    .wa {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #25D366;
      color: white;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
    }

    .error {
      color: #c00;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>WHY GUITAR</h1>
      <div class="subtitle">Cek Status Servis Gitar</div>

      <input
        type="text"
        id="serviceNo"
        placeholder="Masukkan No. Servis"
        autocomplete="off"
      >

      <button onclick="cekStatus()">CEK STATUS</button>

      <div id="hasil"></div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://irfjnhzrfeqqobhntzu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1";

    function formatMoney(value) {
      if (value === null || value === undefined || value === "") {
        return "Belum ditentukan";
      }

      if (typeof value === "number") {
        return "Rp " + value.toLocaleString("id-ID");
      }

      let text = String(value).trim();

      if (/^rp/i.test(text)) {
        text = text.replace(/^rp\.?\s*/i, "");
      }

      const angka = text.replace(/[^\d]/g, "");

      if (angka) {
        return "Rp " + Number(angka).toLocaleString("id-ID");
      }

      return value;
    }

    function getProgress(status) {
      const s = String(status || "").toLowerCase();

      if (s.includes("selesai")) return 100;
      if (s.includes("siap")) return 90;
      if (s.includes("dikerjakan")) return 70;
      if (s.includes("diperiksa")) return 40;
      if (s.includes("masuk")) return 20;

      return 10;
    }

    async function cekStatus() {

      const serviceNo = document
        .getElementById("serviceNo")
        .value
        .trim();

      const hasil = document.getElementById("hasil");

      if (!serviceNo) {
        hasil.innerHTML =
          '<div class="error">Silakan masukkan No. Servis.</div>';
        return;
      }

      hasil.innerHTML = "Sedang mencari data...";

      try {

        const url =
          SUPABASE_URL +
          "/rest/v1/services?service_no=eq." +
          encodeURIComponent(serviceNo) +
          "&select=*";

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!response.ok) {
          throw new Error("Gagal menghubungi database.");
        }

        const data = await response.json();

        if (!data || data.length === 0) {
          hasil.innerHTML =
            '<div class="error">No. Servis tidak ditemukan.</div>';
          return;
        }

        const s = data[0];

        const service = s.service_no || "-";
        const customer = s.customer_name || "-";
        const guitar = s.guitar || "-";
        const status = s.status || "-";
        const technician = s.technician || "-";
        const biaya = formatMoney(s.estimate);

        const progress = getProgress(status);

        hasil.innerHTML = `

          <div class="info">
            <div class="label">No. Servis</div>
            <div class="value">${service}</div>
          </div>

          <div class="info">
            <div class="label">Customer</div>
            <div class="value">${customer}</div>
          </div>

          <div class="info">
            <div class="label">Gitar</div>
            <div class="value">${guitar}</div>
          </div>

          <div class="status">
            Status: ${status}
          </div>

          <div class="label">Progress Servis</div>
          <div class="progress">
            <div
              class="progress-bar"
              style="width:${progress}%"
            ></div>
          </div>

          <div class="info">
            <div class="label">Teknisi</div>
            <div class="value">${technician}</div>
          </div>

          <div class="info">
            <div class="label">Estimasi Biaya</div>
            <div class="value">${biaya}</div>
          </div>

          <a
            class="wa"
            href="https://wa.me/628xxxxxxxxxx"
            target="_blank"
          >
            💬 Hubungi Why Guitar
          </a>
        `;

      } catch (error) {

        console.error(error);

        hasil.innerHTML =
          '<div class="error">Terjadi kesalahan saat mengambil data.</div>';
      }
    }

    document
      .getElementById("serviceNo")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          cekStatus();
        }
      });
  </script>

</body>
</html>
