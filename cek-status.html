<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Guitar - Cek Status</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f3f3;
  padding:20px;
}
.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #ccc;
}
h1{text-align:center}
input{
  width:100%;
  padding:14px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  background:#111;
  color:white;
  border:0;
  border-radius:8px;
  font-size:16px;
}
.info{
  background:#f7f7f7;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
}
.label{
  color:#777;
  font-size:13px;
}
.value{
  font-weight:bold;
  margin-top:4px;
}
.status{
  text-align:center;
  padding:14px;
  margin-top:15px;
  background:#e8f5e9;
  border-radius:8px;
  font-weight:bold;
}
.progress{
  height:12px;
  background:#ddd;
  border-radius:10px;
  margin-top:8px;
  overflow:hidden;
}
.bar{
  height:100%;
  background:#111;
}
.error{
  color:red;
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>WHY GUITAR</h1>
<p style="text-align:center;color:#777">
Cek Status Servis Gitar
</p>

<input
  id="serviceNo"
  type="text"
  placeholder="Masukkan No. Servis"
>

<button onclick="cekStatus()">CEK STATUS</button>

<div id="hasil"></div>

</div>

<script>

const SUPABASE_URL =
"https://irfjnhzrfeqqobhntzu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1";


function formatBiaya(value){

  if(value === null || value === undefined || value === ""){
    return "Belum ditentukan";
  }

  let text = String(value).trim();

  if(text.toLowerCase().startsWith("rp")){
    text = text.replace(/^rp\.?\s*/i,"");
  }

  let angka = text.replace(/[^\d]/g,"");

  if(angka){
    return "Rp " + Number(angka).toLocaleString("id-ID");
  }

  return value;
}


function progressStatus(status){

  let s = String(status).toLowerCase();

  if(s.includes("selesai")) return 100;
  if(s.includes("siap")) return 90;
  if(s.includes("dikerjakan")) return 70;
  if(s.includes("diperiksa")) return 40;
  if(s.includes("masuk")) return 20;

  return 10;
}


async function cekStatus(){

  const nomor =
    document.getElementById("serviceNo").value.trim();

  const hasil =
    document.getElementById("hasil");

  if(!nomor){
    hasil.innerHTML =
    '<div class="error">Masukkan No. Servis terlebih dahulu.</div>';
    return;
  }

  hasil.innerHTML = "Mencari data...";

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/services" +
      "?service_no=eq." +
      encodeURIComponent(nomor) +
      "&select=service_no,customer_name,guitar,status,technician,estimate";

    const response = await fetch(url,{
      method:"GET",
      headers:{
        "apikey":SUPABASE_KEY
      }
    });

    const data = await response.json();

    console.log("DATA SUPABASE:",data);

    if(!response.ok){
      throw new Error(
        data.message || "Database tidak dapat diakses"
      );
    }

    if(!data || data.length === 0){

      hasil.innerHTML =
      '<div class="error">No. Servis tidak ditemukan.</div>';

      return;
    }

    const s = data[0];

    const persen =
      progressStatus(s.status);

    hasil.innerHTML = `

      <div class="info">
        <div class="label">No. Servis</div>
        <div class="value">${s.service_no || "-"}</div>
      </div>

      <div class="info">
        <div class="label">Customer</div>
        <div class="value">${s.customer_name || "-"}</div>
      </div>

      <div class="info">
        <div class="label">Gitar</div>
        <div class="value">${s.guitar || "-"}</div>
      </div>

      <div class="status">
        Status: ${s.status || "-"}
      </div>

      <div class="label" style="margin-top:15px">
        Progress Servis
      </div>

      <div class="progress">
        <div class="bar" style="width:${persen}%"></div>
      </div>

      <div class="info">
        <div class="label">Teknisi</div>
        <div class="value">${s.technician || "-"}</div>
      </div>

      <div class="info">
        <div class="label">Estimasi Biaya</div>
        <div class="value">
          ${formatBiaya(s.estimate)}
        </div>
      </div>

    `;

  }catch(error){

    console.error(error);

    hasil.innerHTML =
    '<div class="error">Gagal mengambil data dari database.</div>';
  }
}


document
.getElementById("serviceNo")
.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    cekStatus();
  }

});

</script>

</body>
</html>
