<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WHY GUITAR — Cek Status Service</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090a0c;
  color:#f4f4f4;
  font-family:Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(
    circle at 50% 0%,
    #35110f 0,
    #090a0c 55%
  );
  z-index:-1;
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:25px 16px 45px;
}

header{
  text-align:center;
  margin-bottom:25px;
}

.logo-text{
  font-size:36px;
  font-weight:900;
  letter-spacing:2px;
}

.logo-text span{
  color:#e12626;
}

.subtitle{
  color:#aaa;
  margin-top:8px;
}

.card{
  background:rgba(28,29,34,.95);
  border:1px solid #35363e;
  border-radius:24px;
  padding:22px;
  margin:18px 0;
  box-shadow:0 10px 35px #0008;
}

h2{
  margin-top:0;
}

input{
  width:100%;
  padding:17px;
  border-radius:14px;
  border:1px solid #3a3b43;
  background:#101116;
  color:white;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#e12626;
}

button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#e12626;
  color:white;
  font-weight:700;
  font-size:17px;
  margin-top:10px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#25272e;
}

.result{
  margin-top:18px;
}

.item{
  background:#15171d;
  border:1px solid #33353e;
  border-radius:20px;
  padding:18px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.no{
  font-size:23px;
  font-weight:800;
}

.muted{
  color:#a9acb5;
}

.pill{
  padding:9px 13px;
  border-radius:99px;
  background:#183b2b;
  color:#75e0a7;
  font-weight:700;
}

.detail{
  margin-top:12px;
  padding:13px 0;
  border-top:1px solid #30323a;
  color:#ddd;
  line-height:1.6;
}

.photos-title{
  font-size:20px;
  font-weight:800;
  margin:22px 0 12px;
}

.photos{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.photo-box{
  background:#101116;
  border:1px solid #3a3b43;
  border-radius:16px;
  padding:10px;
  overflow:hidden;
}

.photo-box b{
  display:block;
  font-size:13px;
  margin-bottom:9px;
  letter-spacing:.4px;
}

.photo-box img{
  display:block;
  width:100%;
  height:auto;
  max-height:380px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer;
}

.empty-photo{
  color:#888;
  font-size:14px;
}

.err{
  color:#ff8b8b;
  background:#351616;
  border:1px solid #662727;
  padding:13px;
  border-radius:12px;
}

.loading{
  color:#ccc;
  text-align:center;
  padding:15px;
}

.footer{
  text-align:center;
  color:#777;
  margin-top:30px;
  font-size:13px;
}

@media(max-width:520px){

  .wrap{
    padding:20px 12px 35px;
  }

  .logo-text{
    font-size:30px;
  }

  .card{
    padding:17px;
    border-radius:20px;
  }

  .photos{
    grid-template-columns:1fr;
  }

  .photo-box img{
    max-height:none;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="logo-text">
    WHY <span>GUITAR</span>
  </div>

  <div class="subtitle">
    Cek Status Service Gitar
  </div>
</header>


<div class="card">

  <h2>🎸 Cek Service Gitar</h2>

  <p class="muted">
    Masukkan nomor service gitar Anda untuk melihat
    status pengerjaan dan dokumentasi service.
  </p>

  <input
    id="serviceNo"
    type="text"
    placeholder="Contoh: WG-001"
    autocomplete="off"
  >

  <button onclick="checkStatus()">
    🔍 CEK STATUS
  </button>

  <button class="secondary" onclick="clearStatus()">
    🔄 CEK ULANG
  </button>

  <div id="statusResult" class="result"></div>

</div>


<div class="card">

  <h3>📸 Dokumentasi Service</h3>

  <p class="muted">
    Foto sebelum dan sesudah service dapat dilihat
    setelah nomor service ditemukan.
  </p>

</div>


<div class="footer">
  WHY GUITAR
  <br>
  Guitar Service & Setup
</div>

</div>


<script>

const SUPABASE_URL =
'https://irfjnhzrfeqqobhbntzu.supabase.co';

const SUPABASE_KEY =
'sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1';


function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g,function(c){

      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[c];

    });

}


function money(value){

  const n = Number(value || 0);

  return 'Rp ' + n.toLocaleString('id-ID');

}


function parsePhotos(raw){

  if(!raw){
    return {
      before:null,
      after:null
    };
  }

  try{

    const p =
      typeof raw === 'string'
      ? JSON.parse(raw)
      : raw;

    return {
      before:p?.before || null,
      after:p?.after || null
    };

  }catch(e){

    return {
      before:null,
      after:null
    };

  }

}


function photoHtml(service){

  const photos =
    parsePhotos(service.photo_url);

  if(!photos.before && !photos.after){

    return `
      <div class="photos-title">
        📸 Dokumentasi Service
      </div>

      <div class="empty-photo">
        Belum ada foto dokumentasi.
      </div>
    `;

  }


  return `

    <div class="photos-title">
      📸 Dokumentasi Service
    </div>

    <div class="photos">

      ${
        photos.before
        ?
        `
        <div class="photo-box">

          <b>
            📷 SEBELUM SERVICE
          </b>

          <img
            src="${photos.before}"
            alt="Foto sebelum service"
            onclick="window.open(this.src,'_blank')"
          >

        </div>
        `
        :
        ''
      }


      ${
        photos.after
        ?
        `
        <div class="photo-box">

          <b>
            📷 SESUDAH SERVICE
          </b>

          <img
            src="${photos.after}"
            alt="Foto sesudah service"
            onclick="window.open(this.src,'_blank')"
          >

        </div>
        `
        :
        ''
      }

    </div>

  `;

}


function renderService(s){

  const status =
    s.status || 'Sedang dikerjakan';


  document.getElementById('statusResult').innerHTML = `

    <div class="item">

      <div class="row">

        <div>

          <div class="no">
            ${esc(s.service_no || '—')}
          </div>

          <div class="muted">
            ${esc(s.customer_name || '')}
          </div>

        </div>

        <span class="pill">
          ${esc(status)}
        </span>

      </div>


      <div class="detail">

        👤 <b>Pelanggan</b><br>
        ${esc(s.customer_name || '—')}

      </div>


      <div class="detail">

        🎸 <b>Gitar</b><br>
        ${esc(s.guitar || '—')}

      </div>


      <div class="detail">

        💰 <b>Biaya Service</b><br>
        ${money(s.cost)}

      </div>


      <div class="detail">

        💵 <b>Sudah Dibayar</b><br>
        ${money(s.paid)}

      </div>


      <div class="detail">

        🧾 <b>Sisa Pembayaran</b><br>
        ${money(
          Math.max(
            0,
            Number(s.cost || 0) -
            Number(s.paid || 0)
          )
        )}

      </div>


      ${
        s.complaint
        ?
        `
        <div class="detail">

          🔧 <b>Keluhan / Pekerjaan</b><br>
          ${esc(s.complaint)}

        </div>
        `
        :
        ''
      }


      ${photoHtml(s)}

    </div>

  `;

}


async function checkStatus(){

  const input =
    document.getElementById('serviceNo');

  const result =
    document.getElementById('statusResult');


  const no =
    input.value.trim();


  if(!no){

    result.innerHTML = `
      <div class="err">
        Masukkan nomor service terlebih dahulu.
      </div>
    `;

    input.focus();

    return;
  }


  result.innerHTML = `
    <div class="loading">
      🔄 Mencari data service...
    </div>
  `;


  try{

    const url =
      SUPABASE_URL +
      '/rest/v1/services' +

      '?select=' +
      'service_no,' +
      'customer_name,' +
      'guitar,' +
      'status,' +
      'cost,' +
      'paid,' +
      'complaint,' +
      'photo_url,' +
      'updated_at' +

      '&service_no=eq.' +
      encodeURIComponent(no) +

      '&limit=1';


    const response =
      await fetch(url,{

        headers:{
          apikey:SUPABASE_KEY,
          Authorization:
            'Bearer ' + SUPABASE_KEY
        }

      });


    if(!response.ok){

      throw new Error(
        'Server tidak dapat diakses'
      );

    }


    const data =
      await response.json();


    if(!data.length){

      result.innerHTML = `
        <div class="err">
          ❌ Nomor service
          <b>${esc(no)}</b>
          tidak ditemukan.
        </div>
      `;

      return;
    }


    renderService(data[0]);


  }catch(error){

    console.error(error);

    result.innerHTML = `
      <div class="err">

        ❌ Tidak dapat terhubung
        ke server.

        <br><br>

        Silakan coba lagi.

      </div>
    `;

  }

}


function clearStatus(){

  document.getElementById('serviceNo').value = '';

  document.getElementById('statusResult').innerHTML = '';

  document.getElementById('serviceNo').focus();

}


document
  .getElementById('serviceNo')
  .addEventListener(
    'keydown',
    function(event){

      if(event.key === 'Enter'){

        checkStatus();

      }

    }
  );

</script>

</body>
</html>
