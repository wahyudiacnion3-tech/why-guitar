<title>WHY GUITAR — Cek Status Gitar</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#090a0c;color:#f4f4f4;font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,#35110f 0,#090a0c 55%);z-index:-1}
.wrap{max-width:720px;margin:auto;padding:28px 18px 40px}
.logo{display:block;width:min(100%,390px);max-height:220px;object-fit:contain;margin:0 auto 14px;border-radius:22px}
.tag{text-align:center;color:#ddd;font-style:italic;font-size:20px;margin-bottom:26px}
.tag:after{content:"";display:block;width:120px;height:2px;background:#e12626;margin:10px auto}
h1{text-align:center;font-size:42px;margin:8px 0} .sub{text-align:center;color:#aeb1ba;font-size:18px;margin-bottom:24px}
.card{background:rgba(28,29,34,.9);border:1px solid #35363e;border-radius:26px;padding:24px;margin:18px 0;box-shadow:0 10px 35px #0008}
input{width:100%;padding:17px;border-radius:15px;border:1px solid #3a3b43;background:#101116;color:white;font-size:17px;outline:none;margin:7px 0}
button{width:100%;padding:17px;border:0;border-radius:15px;background:#e12626;color:white;font-weight:700;font-size:18px;margin-top:10px}
button:active{transform:scale(.99)} .result{margin-top:18px}
.item{background:#15171d;border:1px solid #33353e;border-radius:18px;padding:18px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.no{font-size:22px;font-weight:800} .muted{color:#a9acb5} .pill{padding:8px 12px;border-radius:99px;background:#183b2b;color:#75e0a7;font-weight:700}
.detail{margin-top:10px;padding:12px 0;border-top:1px solid #30323a;color:#ddd}
.err{color:#ff8b8b;margin-top:12px} .ok{color:#75e0a7;margin-top:12px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .link{text-align:center;background:#15171d;border:1px solid #33353e;border-radius:18px;padding:18px 8px;text-decoration:none;color:white}
footer{text-align:center;color:#999;margin-top:30px;letter-spacing:4px} footer small{display:block;letter-spacing:0;margin-top:10px}
@media(max-width:520px){h1{font-size:34px} .links{grid-template-columns:1fr}}
</style>

<script>
const SUPA={url:'https://irfjnhzrfeqqobhbntzu.supabase.co',key:'sb_publishable_XbSV_b9aa10bIWE8YqauBw_KPypPIe1'};
async function api(path){
 const r=await fetch(SUPA.url+'/rest/v1/'+path,{headers:{apikey:SUPA.key,Authorization:'Bearer '+SUPA.key}});
 if(!r.ok) throw new Error('Gagal mengambil data');
 return r.json();
}
function money(v){return 'Rp '+Number(v||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x){
 const s=x.status||'Sedang dikerjakan';
 return `<div class="item"><div class="row"><div><div class="no">${esc(x.service_no||'—')}</div><div class="muted">${esc(x.customer_name||'')} · ${esc(x.guitar||'')}</div></div><span class="pill">${esc(s)}</span></div>
 <div class="detail">Pelanggan: <b>${esc(x.customer_name||'—')}</b><br>Gitar: <b>${esc(x.guitar||'—')}</b><br>Biaya: <b>${money(x.cost)}</b><br>Sudah dibayar: <b>${money(x.paid)}</b><br>Sisa: <b>${money(Math.max(0,Number(x.cost||0)-Number(x.paid||0)))}</b></div></div>`;
}
async function checkStatus(){
 const no=document.getElementById('serviceNo').value.trim(); const out=document.getElementById('statusResult');
 if(!no){out.innerHTML='<div class="err">Masukkan nomor service dulu.</div>';return}
 out.innerHTML='Memuat...';
 try{const d=await api(`services?select=service_no,customer_name,guitar,status,cost,paid,complaint,updated_at&service_no=eq.${encodeURIComponent(no)}&limit=1`);
 out.innerHTML=d.length?card(d[0]):'<div class="err">Nomor service tidak ditemukan.</div>'}
 catch(e){out.innerHTML='<div class="err">Tidak dapat terhubung ke server.</div>'}
}
async function checkHistory(){
 const p=document.getElementById('phone').value.trim(); const no=document.getElementById('historyNo').value.trim(); const out=document.getElementById('historyResult');
 if(!p||!no){out.innerHTML='<div class="err">Isi nomor WhatsApp dan nomor service.</div>';return}
 out.innerHTML='Memuat...';
 try{const d=await api(`services?select=*&service_no=eq.${encodeURIComponent(no)}&phone=eq.${encodeURIComponent(p)}&order=created_at.desc`);
 out.innerHTML=d.length?d.map(card).join(''):'<div class="err">Data tidak ditemukan. Pastikan nomor WhatsApp dan nomor service benar.</div>'}
 catch(e){out.innerHTML='<div class="err">Tidak dapat terhubung ke server.</div>'}
}
</script>
