<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHY GUITAR - Service</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#08090b;
  color:#fff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:680px;
  background:#17191f;
  border:1px solid #30333b;
  border-radius:28px;
  padding:55px 30px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
  width:180px;
  height:180px;
  object-fit:contain;
  border-radius:25px;
  margin-bottom:35px;
  background:#000;
}

h1{
  font-size:42px;
  margin:0 0 14px;
  font-weight:800;
}

.subtitle{
  color:#aeb2bd;
  font-size:20px;
  margin-bottom:45px;
}

.button{
  display:block;
  width:100%;
  padding:20px;
  margin:20px 0;
  border-radius:18px;
  background:#ed2027;
  color:white;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
  border:0;
  cursor:pointer;
  transition:.2s;
}

.button:active{
  transform:scale(.97);
}

.footer{
  margin-top:35px;
  color:#777d89;
  font-size:13px;
}

@media(max-width:500px){
  .container{
    padding:45px 20px;
  }

  .logo{
    width:160px;
    height:160px;
  }

  h1{
    font-size:36px;
  }

  .subtitle{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <img
    class="logo"
    src="logo.png"
    alt="WHY GUITAR"
  >

  <h1>WHY GUITAR</h1>

  <div class="subtitle">
    Cek Status Service Gitar
  </div>

<a class="button" href="https://whyguitarservice.github.io/why-guitar/cek-status.html">
    🎸 Buka Cek Status
  </a>

  <a class="button" href="admin.html">
    🔐 Buka Admin
  </a>

  <div class="footer">
    WHY GUITAR SERVICE
  </div>

</div>

</body>
</html>
